[package]
name = "phylode"
version = "1.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Strofai/Phylode"
publish = false

[dependencies]
async-trait = "0.1.92"
# With system-configuration below: Apple's SystemConfiguration framework, which networks
# this Mac is on and when that changes. Both already came in through hickory-resolver.
core-foundation = "0.9.4"
futures-util = "0.3.34"
hickory-proto = "0.26.3"
hickory-resolver = { version = "0.26.3", features = ["https-ring", "tls-ring", "rustls-platform-verifier"] }
hickory-server = "0.26.3"
# Reads the system time zone and its rules from /usr/share/zoneinfo; nothing is bundled.
jiff = { version = "0.2.37", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
raunch = "1.0.1"
system-configuration = "0.7.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "sync", "time", "signal", "macros", "fs", "io-util"] }

# cargo fuzz compiles with --cfg fuzzing; registering it keeps ordinary builds from warning
# about an unknown cfg.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
