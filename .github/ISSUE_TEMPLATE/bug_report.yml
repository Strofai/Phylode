name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems should not go here — use private reporting (see SECURITY.md).
        Please remove anything that identifies your home network (addresses, device names) from
        the output you paste.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. sudo ./deploy/install.sh
        2. dig @127.0.0.1 example.com
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: macOS 26.1, Apple silicon
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Phylode commit
      description: Output of `git rev-parse --short HEAD` in your checkout.
  - type: textarea
    id: status
    attributes:
      label: Output of `phylode status`
      render: text
  - type: textarea
    id: log
    attributes:
      label: Last lines of the service log
      description: "`sudo tail -40 /var/log/phylode/stderr.log`"
      render: text
