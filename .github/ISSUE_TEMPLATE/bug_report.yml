name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems should not go here — use private reporting (see SECURITY.md).
        Issues are public. Please do not paste your query journal, `phylode status` or the raw
        service log: they contain the domains your household looked up, your network addresses
        and your file paths. `phylode diagnostics` below is written to be safe to share.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. sudo phylode install
        2. dig @127.0.0.1 example.com
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Phylode commit
      description: Output of `git rev-parse --short HEAD` in your checkout.
  - type: textarea
    id: diagnostics
    attributes:
      label: Output of `phylode diagnostics`
      description: |
        Versions, states, counts and recent service events, with addresses and home folders
        removed. It contains no domains and no names from your configuration. Read it before
        posting; run it with sudo if it says the service log could not be read.
      render: text
    validations:
      required: true
