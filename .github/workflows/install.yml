name: Install test

# Runs `phylode install`, `on`, `off` and `uninstall` for real on a throwaway macOS runner and
# exercises the installed service end to end. This is the path the README gives to new users,
# so it must work on a clean machine.

on:
  push:
    branches: [main]
    paths: ["src/**", "deploy/**", "Cargo.toml", "Cargo.lock", ".github/workflows/install.yml"]
  pull_request:
    paths: ["src/**", "deploy/**", "Cargo.toml", "Cargo.lock", ".github/workflows/install.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release

      # With the firewall on, install must still succeed and register the binary on the firewall's
      # allowed list. Whether that entry is what lets other devices through cannot be shown here:
      # on this runner, queries on the network address are answered even with the entry blocked.
      - name: Install refuses a folder an access control entry opens to standard accounts
        run: |
          entry="group:staff allow add_file,delete_child"
          sudo chmod +a "$entry" /usr/local/bin
          if out=$(sudo ./target/release/phylode install 2>&1); then
            echo "$out"; echo "::error::install accepted /usr/local/bin with \"$entry\""; exit 1
          fi
          echo "$out"
          echo "$out" | grep -q "can be changed by an account that is not an administrator" \
            || { echo "::error::install failed, but not because of the folder"; exit 1; }
          if test -e /usr/local/bin/phylode; then echo "::error::install wrote before refusing"; exit 1; fi
          sudo chmod -a "$entry" /usr/local/bin

      - name: Turn the macOS firewall on, as many Macs have it
        run: sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate on

      - name: Install
        run: |
          start=$(date +%s)
          sudo ./target/release/phylode install
          echo "install took $(( $(date +%s) - start ))s, including the list download and the first answer"
          /usr/libexec/ApplicationFirewall/socketfilterfw --listapps | grep -q /usr/local/bin/phylode \
            || { echo "::error::install did not register with the firewall"; exit 1; }
          # newsyslog reads the rotation file and would rotate each service log.
          rotation=$(sudo newsyslog -nv -f /etc/newsyslog.d/phylode.conf 2>&1) \
            || { echo "$rotation"; echo "::error::newsyslog cannot read the rotation file"; exit 1; }
          echo "$rotation"
          echo "$rotation" | grep -q "/var/log/phylode/stderr.log" \
            || { echo "::error::newsyslog does not look at the service log"; exit 1; }
          id=$(dscl . -read /Users/_phylode UniqueID | awk '{print $2}')
          echo "service account ID: $id"
          [ "$id" -ge 400 ] && [ "$id" -le 499 ] \
            || { echo "::error::the service account took ID $id, outside 400-499"; exit 1; }

      - name: Other devices can use it through this Mac's network address
        run: |
          lan=$(ipconfig getifaddr en0 || ipconfig getifaddr en1)
          echo "network address: $lan"
          dig @"$lan" apple.com +short +time=3 +tries=2 | grep -E '^[0-9.]+$' \
            || { echo "::error::no answer on $lan"; exit 1; }
          dig @"$lan" iadsdk.apple.com +short +time=3 +tries=2 | grep -qx '0.0.0.0' \
            || { echo "::error::not blocking on $lan"; exit 1; }

      - name: Root owns the log folder, and the service account only its logs and journal
        run: |
          ls -la /var/log/phylode
          [ "$(stat -f '%Su' /var/log/phylode)" = root ] \
            || { echo "::error::the service account can change the folder newsyslog rotates in"; exit 1; }
          for log in stderr stdout update; do
            [ "$(stat -f '%Su:%Sg %Lp' /var/log/phylode/$log.log)" = "_phylode:admin 640" ] \
              || { echo "::error::$log.log is not the service's"; exit 1; }
          done
          [ "$(stat -f '%Su:%Sg %Lp' /var/log/phylode/queries)" = "_phylode:admin 750" ] \
            || { echo "::error::the journal folder is not the service's"; exit 1; }
          dig @127.0.0.1 journal-check.example.com +short > /dev/null || true
          for _ in $(seq 1 15); do
            sudo grep -rqs journal-check.example.com /var/log/phylode/queries && break
            sleep 1
          done
          sudo grep -rqs journal-check.example.com /var/log/phylode/queries \
            || { echo "::error::the service could not write its journal"; exit 1; }

      - name: The service refuses to run as root
        run: |
          if out=$(sudo /usr/local/bin/phylode --config /usr/local/etc/phylode.conf 2>&1); then
            echo "$out"; echo "::error::the service ran as root"; exit 1
          fi
          echo "$out"
          echo "$out" | grep -q "does not run as root" \
            || { echo "::error::it stopped, but not because it was root"; exit 1; }

      - name: Updating over an older install removes a link planted among the logs
        run: |
          # The layout before this fix: the service account owned the folder and could put a
          # link to a system file where newsyslog and install expect a log.
          sudo chown _phylode /var/log/phylode
          sudo -u _phylode ln -sf /etc/hosts /var/log/phylode/stdout.log.planted
          sudo -u _phylode mv -f /var/log/phylode/stdout.log.planted /var/log/phylode/stdout.log
          sudo ./target/release/phylode install
          [ "$(stat -f '%Su' /etc/hosts)" = root ] \
            || { echo "::error::install changed the owner of the file a link pointed at"; exit 1; }
          [ -f /var/log/phylode/stdout.log ] && [ ! -L /var/log/phylode/stdout.log ] \
            || { echo "::error::the planted link is still there"; exit 1; }
          [ "$(stat -f '%Su' /var/log/phylode)" = root ] \
            || { echo "::error::install left the folder with the service account"; exit 1; }

      - name: Reinstalling over a running service (an update) keeps it answering
        run: |
          sudo ./target/release/phylode install
          lan=$(ipconfig getifaddr en0 || ipconfig getifaddr en1)
          dig @"$lan" apple.com +short +time=3 +tries=2 | grep -E '^[0-9.]+$' \
            || { echo "::error::no answer on $lan after reinstalling"; exit 1; }

      - name: Resolves through the service
        run: |
          dig @127.0.0.1 apple.com +short | grep -E '^[0-9.]+$'
          dig @127.0.0.1 apple.com AAAA +tcp +short

      - name: Blocks straight away, because install waited for the lists
        run: |
          answer=$(dig @127.0.0.1 iadsdk.apple.com +short +time=2 +tries=1 || true)
          if [ "$answer" != "0.0.0.0" ]; then
            echo "::error::iadsdk.apple.com was not blocked right after install (got '$answer')"
            phylode status || true
            exit 1
          fi
          echo "blocked: iadsdk.apple.com -> 0.0.0.0"

      - name: Apple hard rules always resolve
        run: |
          for host in captive.apple.com api.push.apple.com 1-courier.push.apple.com; do
            answer=$(dig @127.0.0.1 "$host" +short | tail -1)
            if [ -z "$answer" ] || [ "$answer" = "0.0.0.0" ]; then
              echo "::error::$host did not resolve (got '$answer')"; exit 1
            fi
            echo "$host -> $answer"
          done

      - name: allow and block work without sudo
        run: |
          phylode allow iadsdk.apple.com
          allowed=0
          for _ in $(seq 1 15); do
            answer=$(dig @127.0.0.1 iadsdk.apple.com +short | tail -1)
            if [ -n "$answer" ] && [ "$answer" != "0.0.0.0" ]; then echo "allowed: $answer"; allowed=1; break; fi
            sleep 1
          done
          if [ "$allowed" -ne 1 ]; then echo "::error::allow did not take effect"; exit 1; fi
          phylode block iadsdk.apple.com
          for _ in $(seq 1 15); do
            if [ "$(dig @127.0.0.1 iadsdk.apple.com +short)" = "0.0.0.0" ]; then echo "blocked again"; exit 0; fi
            sleep 1
          done
          echo "::error::block did not take effect"; exit 1

      - name: status and report work without sudo, and a fresh install reports no gap
        run: |
          phylode status
          report=$(phylode report)
          echo "$report"
          if echo "$report" | grep -q "blocklist failed to load"; then
            echo "::error::a fresh install already reports a window without protection"; exit 1
          fi

      - name: diagnostics sees a healthy install and leaks no addresses or home folders
        run: |
          out=$(sudo phylode diagnostics)
          echo "$out"
          echo "$out" | grep -qx 'Service answering: yes' || { echo "::error::diagnostics did not see the service answering"; exit 1; }
          echo "$out" | grep -q 'domains loaded' || { echo "::error::diagnostics did not see the lists"; exit 1; }
          leaked=$(echo "$out" | grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' | grep -vxE '127\.0\.0\.1|0\.0\.0\.0' || true)
          if [ -n "$leaked" ] || echo "$out" | grep -q '/Users/'; then
            echo "::error::diagnostics leaked: $leaked"; exit 1
          fi

      - name: launchd brings the service back after it dies
        run: |
          pid=$(pgrep -x phylode)
          sudo kill -9 "$pid"
          for _ in $(seq 1 30); do
            new=$(pgrep -x phylode || true)
            if [ -n "$new" ] && [ "$new" != "$pid" ] && dig @127.0.0.1 apple.com +short +time=1 +tries=1 | grep -q .; then
              echo "restarted: pid $pid -> $new"; exit 0
            fi
            sleep 1
          done
          echo "::error::the service did not come back"; exit 1

      # Stuck but still running is what launchd cannot see. Dropping UDP on the loopback interface
      # makes the self health check go unanswered while the process stays alive.
      - name: A service that stops answering restarts itself, and the summary says so
        run: |
          pid=$(pgrep -x phylode)
          echo "block drop quick on lo0 proto udp from any to any port 53" | sudo pfctl -q -f -
          token=$(sudo pfctl -E 2>&1 | sed -n 's/.*Token : //p')
          start=$(date +%s)
          restarted=0
          for _ in $(seq 1 90); do
            new=$(pgrep -x phylode || true)
            if [ -n "$new" ] && [ "$new" != "$pid" ]; then restarted=1; break; fi
            sleep 1
          done
          sudo pfctl -q -X "$token" || sudo pfctl -q -d || true
          sudo pfctl -q -f /etc/pf.conf
          if [ "$restarted" -ne 1 ]; then echo "::error::a service that stopped answering was not restarted"; exit 1; fi
          echo "restarted itself after $(( $(date +%s) - start ))s: pid $pid -> $new"
          answered=0
          for _ in $(seq 1 30); do
            if dig @127.0.0.1 apple.com +short +time=1 +tries=1 | grep -q .; then answered=1; break; fi
            sleep 1
          done
          if [ "$answered" -ne 1 ]; then echo "::error::no answers after the restart"; exit 1; fi
          report=$(phylode report)
          echo "$report" | sed -n '/own health/,$p'
          echo "$report" | grep -q "Phylode stopped answering and restarted itself" \
            || { echo "::error::the weekly summary does not mention the restart"; exit 1; }

      # The query for a made-up name must leave this Mac only inside TLS. Loopback is captured
      # too, as the control: the same grep has to find the name there in plaintext.
      - name: Queries leave the Mac encrypted, with no name in plaintext
        run: |
          iface=$(route -n get default | awk '/interface:/{print $2}')
          name="leak-check-$RANDOM$RANDOM"
          sudo tcpdump -i "$iface" -nn -U -w "$RUNNER_TEMP/out.pcap" 2>/dev/null &
          sudo tcpdump -i lo0 -nn -U -w "$RUNNER_TEMP/lo.pcap" 'udp port 53' 2>/dev/null &
          sleep 2
          # A fresh start, so the capture holds the TLS handshake as well as the query.
          sudo launchctl kickstart -k system/com.Phylode.gatekeeper
          for _ in $(seq 1 30); do
            if dig @127.0.0.1 captive.apple.com +short +time=1 +tries=1 | grep -q .; then break; fi
            sleep 1
          done
          dig @127.0.0.1 "$name.example.com" +time=3 +tries=1 || true
          sleep 2
          sudo pkill tcpdump || true
          sleep 1
          sudo chmod a+r "$RUNNER_TEMP/out.pcap" "$RUNNER_TEMP/lo.pcap"
          grep -aq "$name" "$RUNNER_TEMP/lo.pcap" \
            || { echo "::error::control failed: the name is not in the loopback capture either"; exit 1; }
          if grep -aq "$name" "$RUNNER_TEMP/out.pcap"; then
            echo "::error::$name left the Mac in plaintext"; exit 1
          fi
          plain=$(tcpdump -r "$RUNNER_TEMP/out.pcap" -nn 'port 53 and (host 1.1.1.1 or host 9.9.9.9)' 2>/dev/null | wc -l)
          if [ "$plain" -ne 0 ]; then echo "::error::$plain plaintext DNS packets to an upstream"; exit 1; fi
          encrypted=$(tcpdump -r "$RUNNER_TEMP/out.pcap" -nn \
            '(host 1.1.1.1 and tcp port 853) or (host 9.9.9.9 and tcp port 443)' 2>/dev/null | wc -l)
          if [ "$encrypted" -eq 0 ]; then echo "::error::no traffic to an encrypted upstream"; exit 1; fi
          # A TLS record starts with its type: 0x16 is a handshake. DoT sends no server name
          # (hickory turns SNI off), so the record type is what shows the session is TLS.
          tls='tcp[((tcp[12:1] & 0xf0) >> 2):1] = 0x16'
          handshakes=$(tcpdump -r "$RUNNER_TEMP/out.pcap" -nn \
            "((dst host 1.1.1.1 and tcp dst port 853) or (dst host 9.9.9.9 and tcp dst port 443)) and $tls" \
            2>/dev/null | wc -l)
          if [ "$handshakes" -eq 0 ]; then echo "::error::no TLS handshake with an upstream"; exit 1; fi
          echo "loopback: $name in plaintext (control); outside: $encrypted packets to an encrypted upstream,"
          echo "$handshakes of them TLS handshake records, no plaintext DNS to it, and $name nowhere in the capture"

      - name: on and off switch this Mac's DNS
        # A negated command (! cmd) never fails a step under set -e, so each check is explicit.
        run: |
          service=$(networksetup -listallnetworkservices | sed -n 2p)
          # DNS set by hand before `on` must be what `off` puts back.
          sudo networksetup -setdnsservers "$service" 1.1.1.1 9.9.9.9
          out=$(sudo phylode on)
          echo "$out"
          echo "$out" | grep -q "Other devices on this network can use it too: set [0-9]" \
            || { echo "::error::on did not tell the user which address other devices use"; exit 1; }
          if ! networksetup -getdnsservers "$service" | grep -q '^127\.0\.0\.1$'; then
            echo "::error::on did not point \"$service\" at the service"; exit 1
          fi
          dig apple.com +short +time=2 | grep -q .
          sudo phylode off
          after=$(networksetup -getdnsservers "$service" | tr '\n' ' ')
          if [ "$after" != "1.1.1.1 9.9.9.9 " ]; then
            echo "::error::off did not put back the DNS set by hand (got '$after')"; exit 1
          fi
          if test -e /usr/local/etc/phylode/dns-before-on.tsv; then
            echo "::error::off left its saved DNS file behind"; exit 1
          fi
          sudo networksetup -setdnsservers "$service" empty

      - name: Uninstall restores DNS and leaves nothing running
        run: |
          service=$(networksetup -listallnetworkservices | sed -n 2p)
          sudo phylode on
          sudo phylode uninstall
          if pgrep -x phylode; then echo "::error::the service is still running"; exit 1; fi
          for f in /usr/local/bin/phylode /Library/LaunchDaemons/com.Phylode.gatekeeper.plist \
                   /Library/LaunchDaemons/com.Phylode.blocklist-update.plist \
                   /usr/local/libexec/phylode-update-lists /etc/newsyslog.d/phylode.conf; do
            if test -e "$f"; then echo "::error::left behind: $f"; exit 1; fi
          done
          if networksetup -getdnsservers "$service" | grep -q '^127\.0\.0\.1$'; then
            echo "::error::uninstall left \"$service\" pointing at the removed service"; exit 1
          fi
          if /usr/libexec/ApplicationFirewall/socketfilterfw --listapps | grep -q /usr/local/bin/phylode; then
            echo "::error::uninstall left the firewall entry behind"; exit 1
          fi
          dig apple.com +short +time=2 | grep -q .

      - name: Service logs
        if: always()
        run: sudo tail -60 /var/log/phylode/stderr.log || true
