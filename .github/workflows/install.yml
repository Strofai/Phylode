name: Install test

# Runs `phylode install`, `on`, `off` and `uninstall` for real on a throwaway macOS runner and
# exercises the installed service end to end. This is the path the README gives to new users,
# so it must work on a clean machine.

on:
  push:
    branches: [main]
    paths: ["src/**", "deploy/**", "Cargo.toml", "Cargo.lock", ".github/workflows/install.yml"]
  pull_request:
    paths: ["src/**", "deploy/**", "Cargo.toml", "Cargo.lock", ".github/workflows/install.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release

      - name: Install
        run: |
          start=$(date +%s)
          sudo ./target/release/phylode install
          echo "install took $(( $(date +%s) - start ))s, including the list download and the first answer"

      - name: Resolves through the service
        run: |
          dig @127.0.0.1 apple.com +short | grep -E '^[0-9.]+$'
          dig @127.0.0.1 apple.com AAAA +tcp +short

      - name: Blocks straight away, because install waited for the lists
        run: |
          answer=$(dig @127.0.0.1 iadsdk.apple.com +short +time=2 +tries=1 || true)
          if [ "$answer" != "0.0.0.0" ]; then
            echo "::error::iadsdk.apple.com was not blocked right after install (got '$answer')"
            phylode status || true
            exit 1
          fi
          echo "blocked: iadsdk.apple.com -> 0.0.0.0"

      - name: Apple hard rules always resolve
        run: |
          for host in captive.apple.com api.push.apple.com 1-courier.push.apple.com; do
            answer=$(dig @127.0.0.1 "$host" +short | tail -1)
            if [ -z "$answer" ] || [ "$answer" = "0.0.0.0" ]; then
              echo "::error::$host did not resolve (got '$answer')"; exit 1
            fi
            echo "$host -> $answer"
          done

      - name: allow and block work without sudo
        run: |
          phylode allow iadsdk.apple.com
          allowed=0
          for _ in $(seq 1 15); do
            answer=$(dig @127.0.0.1 iadsdk.apple.com +short | tail -1)
            if [ -n "$answer" ] && [ "$answer" != "0.0.0.0" ]; then echo "allowed: $answer"; allowed=1; break; fi
            sleep 1
          done
          if [ "$allowed" -ne 1 ]; then echo "::error::allow did not take effect"; exit 1; fi
          phylode block iadsdk.apple.com
          for _ in $(seq 1 15); do
            if [ "$(dig @127.0.0.1 iadsdk.apple.com +short)" = "0.0.0.0" ]; then echo "blocked again"; exit 0; fi
            sleep 1
          done
          echo "::error::block did not take effect"; exit 1

      - name: status and report work without sudo, and a fresh install reports no gap
        run: |
          phylode status
          report=$(phylode report)
          echo "$report"
          if echo "$report" | grep -q "blocklist failed to load"; then
            echo "::error::a fresh install already reports a window without protection"; exit 1
          fi

      - name: diagnostics sees a healthy install and leaks no addresses or home folders
        run: |
          out=$(sudo phylode diagnostics)
          echo "$out"
          echo "$out" | grep -qx 'Service answering: yes' || { echo "::error::diagnostics did not see the service answering"; exit 1; }
          echo "$out" | grep -q 'domains loaded' || { echo "::error::diagnostics did not see the lists"; exit 1; }
          leaked=$(echo "$out" | grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' | grep -vxE '127\.0\.0\.1|0\.0\.0\.0' || true)
          if [ -n "$leaked" ] || echo "$out" | grep -q '/Users/'; then
            echo "::error::diagnostics leaked: $leaked"; exit 1
          fi

      - name: launchd brings the service back after it dies
        run: |
          pid=$(pgrep -x phylode)
          sudo kill -9 "$pid"
          for _ in $(seq 1 30); do
            new=$(pgrep -x phylode || true)
            if [ -n "$new" ] && [ "$new" != "$pid" ] && dig @127.0.0.1 apple.com +short +time=1 +tries=1 | grep -q .; then
              echo "restarted: pid $pid -> $new"; exit 0
            fi
            sleep 1
          done
          echo "::error::the service did not come back"; exit 1

      - name: on and off switch this Mac's DNS
        # A negated command (! cmd) never fails a step under set -e, so each check is explicit.
        run: |
          service=$(networksetup -listallnetworkservices | sed -n 2p)
          sudo phylode on
          if ! networksetup -getdnsservers "$service" | grep -q '^127\.0\.0\.1$'; then
            echo "::error::on did not point \"$service\" at the service"; exit 1
          fi
          dig apple.com +short +time=2 | grep -q .
          sudo phylode off
          if networksetup -getdnsservers "$service" | grep -q '^127\.0\.0\.1$'; then
            echo "::error::off left \"$service\" pointing at the service"; exit 1
          fi

      - name: Uninstall restores DNS and leaves nothing running
        run: |
          service=$(networksetup -listallnetworkservices | sed -n 2p)
          sudo phylode on
          sudo phylode uninstall
          if pgrep -x phylode; then echo "::error::the service is still running"; exit 1; fi
          for f in /usr/local/bin/phylode /Library/LaunchDaemons/com.Phylode.gatekeeper.plist \
                   /Library/LaunchDaemons/com.Phylode.blocklist-update.plist \
                   /usr/local/libexec/phylode-update-lists; do
            if test -e "$f"; then echo "::error::left behind: $f"; exit 1; fi
          done
          if networksetup -getdnsservers "$service" | grep -q '^127\.0\.0\.1$'; then
            echo "::error::uninstall left \"$service\" pointing at the removed service"; exit 1
          fi
          dig apple.com +short +time=2 | grep -q .

      - name: Service logs
        if: always()
        run: sudo tail -60 /var/log/phylode/stderr.log || true
