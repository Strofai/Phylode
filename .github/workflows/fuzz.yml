name: Fuzz

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to run each target
        default: "600"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  fuzz:
    # The weekly schedule only runs once the repository is public, where macOS runners are
    # free; on a private repository each macOS minute is billed at ten times the Linux rate.
    if: github.event_name != 'schedule' || !github.event.repository.private
    name: fuzz ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [request, upstream, blocklist, config]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      # Generated cases accumulate across runs here; corpus/ must come first on the command
      # line or new cases are written into seeds/.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Run
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '600' }}
        # --target is explicit because the prebuilt cargo-fuzz may be an x86_64 binary, and it
        # defaults to its own architecture rather than the runner's installed toolchain.
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cargo fuzz run -s none --target "$(rustc -vV | sed -n 's/^host: //p')" ${{ matrix.target }} \
            fuzz/corpus/${{ matrix.target }} fuzz/seeds/${{ matrix.target }} \
            -- -max_total_time="$SECONDS_PER_TARGET"
      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
