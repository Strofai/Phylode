name: CI

# Every pull request runs CI, because main requires these checks before merging and a check
# skipped by a path filter never reports, leaving the pull request unmergeable. A push to main
# that only changes documentation skips it: nothing here reads those files.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE-*", ".github/ISSUE_TEMPLATE/**", ".github/dependabot.yml"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # macOS only: raunch (launchd socket activation) does not build on other platforms.
  test:
    name: fmt, clippy, test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned by commit, so the toolchain has to be named here instead of in the ref.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Reads dependency metadata only, so it runs on the cheaper Linux runner.
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny
      - run: cargo deny check
      - run: cargo deny --manifest-path fuzz/Cargo.toml --config deny.toml check
