# Phylode configuration. Changes here need a service restart; changes to the list files the
# paths below point at take effect within seconds.

# Port 53 on every interface. Installed as a boot service, launchd binds it (IPv4 and IPv6)
# and this line only tells the health check where to probe; run by hand, it is bound directly.
listen = 0.0.0.0:53

# Which devices get answers: this Mac itself, and devices on the networks it is connected to
# over Ethernet, Wi-Fi or a bridge when those use private addresses (10.x, 172.16-31.x,
# 192.168.x, 169.254.x, 100.64-127.x, and IPv6 fc00::/7 and fe80::/10); anyone else gets no
# response. Peers on a VPN such as Tailscale, another private network behind a router (a
# guest network, an office VLAN), a network on public addresses and devices reaching this
# Mac over a public IPv6 address need a serve_network line, which adds to those. For example:
# serve_network = 198.51.100.0/24
# serve_network = 2001:db8:1:2::/64
# serve_network = 100.64.0.0/10

# Answers pointing into your network are discarded unless the name is listed here: the private
# ranges, every serve_network, and every network this Mac is on all count as your network.
# List names of your own that point at a device at home; each covers its subdomains too.
# internal_domain = nas.example.net

# On an IPv6-only network that reaches IPv4 through NAT64, an address can carry an IPv4 address
# inside it. The standard prefix 64:ff9b::/96 is always read; list your network's own prefix
# here, with one of the lengths /32, /40, /48, /56, /64 or /96, so it is read too.
# nat64_prefix = 64:ff9b:1::/48

# Upstreams are always encrypted, addressed by IP, with the hostname used only to validate the
# certificate. When they are unreachable there is no fallback to plaintext (RFC 8310 Strict
# Privacy, which is also Apple's default).
# One uses port 853 (DoT) and one port 443 (DoH): some networks block 853, and two upstreams on
# the same port would fail together.
upstream = "tls 1.1.1.1 cloudflare-dns.com"
upstream = "https 9.9.9.9 dns.quad9.net"

# How much the lists block. Each level is one of HaGeZi's tiers plus its Threat Intelligence
# Feeds; after changing it, run `sudo phylode install` again to download the new lists.
#   relaxed   HaGeZi Multi NORMAL. For a network where nobody will unblock a site.
#   standard  HaGeZi Multi PRO, the tier HaGeZi recommends. Right for most networks.
#   strict    HaGeZi Multi PRO++. Blocks more, and occasionally a site someone needs; pick it
#             when someone will run `phylode allow` to fix that.
protection = standard

# Blocklists, updated daily by com.Phylode.blocklist-update at the level above. An update that
# cannot be read or is empty is not used, and the previous list keeps blocking. If no list has
# loaded at all, the service keeps running, nothing is blocked during that window, and the
# weekly summary flags it.
blocklist = /usr/local/etc/phylode/lists/hagezi-main.txt
blocklist = /usr/local/etc/phylode/lists/hagezi-tif.txt

# These two are maintained by phylode allow / phylode block; it is fine if they do not exist.
allowlist = /usr/local/etc/phylode/allow.txt
user_blocklist = /usr/local/etc/phylode/block.txt

# How many seconds a device caches a blocked answer. Must stay in single digits; larger and
# allowing a domain appears not to work.
block_ttl_secs = 2

journal_dir = /var/log/phylode/queries
journal_retention_days = 10

# How much of each lookup the journal keeps:
#   All      the device, domain and time of every lookup
#   Domains  the domain and time, not the device
#   Zero     only how many lookups were allowed and blocked each day
# The weekly summary says "cannot tell" for what a level leaves out. A change applies to
# lookups from the next `sudo phylode install` on; what is already kept stays until it
# expires, and `sudo phylode forget` deletes it now. `phylode status` says what is still kept.
journal = All
