# Phylode configuration. Changes here need a service restart; changes to the list files the
# paths below point at take effect within seconds.

# Port 53 on every interface. Installed as a boot service, launchd binds it (IPv4 and IPv6)
# and this line only tells the health check where to probe; run by hand, it is bound directly.
listen = 0.0.0.0:53

# Which devices get answers: those on the private ranges a home, office or school network
# normally uses (10.x, 172.16-31.x, 192.168.x, 100.64-127.x, 169.254.x, and IPv6 fc00::/7
# and fe80::/10) plus this Mac itself; anyone else gets no response. A network on public
# addresses, or devices reaching this Mac over a public IPv6 address, needs a serve_network
# line, which adds to those ranges. For example:
# serve_network = 198.51.100.0/24
# serve_network = 2001:db8:1:2::/64

# Answers pointing into your network are discarded unless the name is listed here: the private
# ranges, every serve_network, and the IPv6 network this Mac is on all count as your network.
# List names of your own that point at a device at home; each covers its subdomains too.
# internal_domain = nas.example.net

# Upstreams are always encrypted, addressed by IP, with the hostname used only to validate the
# certificate. When they are unreachable there is no fallback to plaintext (RFC 8310 Strict
# Privacy, which is also Apple's default).
# One uses port 853 (DoT) and one port 443 (DoH): some networks block 853, and two upstreams on
# the same port would fail together.
upstream = "tls 1.1.1.1 cloudflare-dns.com"
upstream = "https 9.9.9.9 dns.quad9.net"

# Blocklists, updated daily by com.Phylode.blocklist-update (HaGeZi Pro plus Threat Intelligence
# Feeds). An update that cannot be read or is empty is not used, and the previous list keeps
# blocking. If no list has loaded at all, the service keeps running, nothing is blocked during
# that window, and the weekly summary flags it.
blocklist = /usr/local/etc/phylode/lists/hagezi-pro.txt
blocklist = /usr/local/etc/phylode/lists/hagezi-tif.txt

# These two are maintained by phylode allow / phylode block; it is fine if they do not exist.
allowlist = /usr/local/etc/phylode/allow.txt
user_blocklist = /usr/local/etc/phylode/block.txt

# How many seconds a device caches a blocked answer. Must stay in single digits; larger and
# allowing a domain appears not to work.
block_ttl_secs = 2

journal_dir = /var/log/phylode/queries
journal_retention_days = 10
