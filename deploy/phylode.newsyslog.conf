# Rotation for Phylode's service logs, read by macOS newsyslog. `phylode install` puts this file
# in /etc/newsyslog.d/ and `phylode uninstall` removes it.
#
# A log past 1000 KB is renamed and compressed, keeping five. The service keeps writing to the
# file it has open until it next starts, which launchd does each time it restarts it; a broken
# configuration restarts it every 10 seconds, which is when these logs grow fastest.
#
# logfilename                  [owner:group]     mode  count  size(KB)  when  flags
/var/log/phylode/stderr.log    _phylode:admin    640   5      1000      *     NJ
/var/log/phylode/stdout.log    _phylode:admin    640   5      1000      *     NJ
/var/log/phylode/update.log    _phylode:admin    640   5      1000      *     NJ
