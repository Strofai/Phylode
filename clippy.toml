# eprintln! panics when standard error cannot be written (a full disk), ending whichever
# background task it ran in; log_line! carries on instead.
disallowed-macros = [
  { path = "std::eprintln", reason = "panics on a failed write; use phylode::log_line!" },
]

# unwrap_used and expect_used (Cargo.toml) apply to the program; a test that unwraps
# fails loudly, which is what a test should do. These keys cover #[test] functions and
# #[cfg(test)] code only, so a file in tests/ whose helpers unwrap allows both lints at
# its top with #![allow(..., reason = "...")].
allow-unwrap-in-tests = true
allow-expect-in-tests = true
